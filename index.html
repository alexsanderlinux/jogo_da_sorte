<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="/css/style.css">    
</head>
<body>

    <div class="container">
        <h1>Jogo de Adivinhação 🎲</h1>
    
        <p>Eu escolhi um número entre 1 e 100. Tente adivinhar qual é!</p>
    
        <div>
            <label for="palpite">Seu Palpite:</label>
            <input type="number" id="palpite" min="1" max="100">
            <button id="chutar-btn">Chutar</button>
        </div>
    
        <hr>
    
        <p id="tentativas">Tentativas restantes: 10</p>
        
        <p id="mensagem"></p>
    </div>

    <script src="js/script.js"></script>
    
</body>
</html>
