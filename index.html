<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="/css/style.css">    
</head>
<body>

    <div class="container">
        <h1>Jogo de Adivinhação 🎲</h1>
    
        <p>Vou gerar um número entre 1 e 100. Tente adivinhar qual é!</p>
    
        <div>
            <label for="palpite">Seu Palpite:</label>
            <input type="number" id="palpite" min="1" max="100">

            <div class="botoes-container">
                <button id="chutar-btn" type="button">Chutar</button>
                <button id="reiniciar-btn" type="button" disabled>Reiniciar</button>
            </div>
        </div>
    
        <hr>
    
        <p id="tentativas">Tentativas restantes: 10</p>
        
        <p id="mensagem"></p>
    </div>

    <script src="js/script.js"></script>
    
</body>
</html>
